name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Generate App Launcher Icons
        run: |
          cd client
          node scripts/generate-icons.js

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          cd client/android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Stage APK Artifact
        run: |
          mkdir -p build-artifacts
          cp client/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/WeConnect.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeConnect-debug-apk
          path: build-artifacts/WeConnect.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/WeConnect.apk
          generate_release_notes: true
          draft: false
          prerelease: false
