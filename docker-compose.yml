services:
  postgres:
    image: postgres:16-alpine
    container_name: weconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weconnect
      POSTGRES_PASSWORD: weconnect_password
      POSTGRES_DB: weconnect_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weconnect -d weconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weconnect-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://weconnect:weconnect_password@postgres:5432/weconnect_db?sslmode=disable
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
